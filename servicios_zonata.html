
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9efff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ZONATA">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="default">

  <link rel="icon" type="image/png" href="./icono.png">
  <link rel="apple-touch-icon" sizes="180x180"
        href="./apple-touch-icon.png">

  <title>ZONATA | Mis Servicios</title>

  <style>
    :root {
      --azul: #3156d7;
      --azul-fuerte: #274bd1;
      --texto: #0a1b4b;
      --secundario: #394667;
      --borde: #e5ebfa;
      --blanco: #ffffff;
      --sombra:
        0 9px 18px rgba(48,73,145,.11),
        0 2px 4px rgba(48,73,145,.035);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
      color: var(--texto);
      background: linear-gradient(
        143deg,
        #f6f9ff 0%,
        #e4ecff 54%,
        #dce5fc 100%
      );
      -webkit-font-smoothing: antialiased;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    /* CONTENEDOR */

    .app {
      position: relative;
      isolation: isolate;
      width: min(100%, 1120px);
      min-height: 100svh;
      margin: 0 auto;
      padding:
        calc(12px + env(safe-area-inset-top))
        13px
        calc(20px + env(safe-area-inset-bottom));
      overflow: hidden;

      background:
        radial-gradient(
          ellipse 80% 34% at 88% 24%,
          rgba(207,201,255,.4),
          transparent 78%
        ),
        radial-gradient(
          ellipse 60% 35% at 7% 66%,
          rgba(231,241,255,.85),
          transparent 83%
        );
    }

    .app::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -16%;
      right: -18%;
      top: 16%;
      height: 240px;
      border-radius: 49% 51% 54% 46%;
      background: linear-gradient(
        115deg,
        rgba(251,252,255,.74),
        rgba(205,213,255,.34)
      );
      transform: rotate(-8deg);
      pointer-events: none;
    }

    /* ENCABEZADO */

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 59px;
      padding: 9px 12px;
      border-radius: 21px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.97);
      box-shadow:
        0 4px 16px rgba(68,92,160,.045);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 850;
      letter-spacing: .035em;
      line-height: 1;
      white-space: nowrap;
    }

    .separator {
      height: 24px;
      border-left: 1px solid #bfcce9;
      margin: 0 2px;
    }

    .header-label {
      font-size: 12px;
      font-weight: 550;
      white-space: nowrap;
    }

    /* BOTÓN INICIO */

    .home {
      margin-left: auto;
      display: grid;
      place-items: center;
      height: 36px;
      width: 36px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      color: #1855ba;
      background: #eaf0ff;
      cursor: pointer;
    }

    .home svg {
      width: 20px;
      height: 20px;
    }

    /* PRESENTACIÓN PRINCIPAL */

    .hero {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 131px;
      padding: 18px 8px 15px;
    }

    .hero-logo {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
      object-fit: contain;
      filter: drop-shadow(
        0 8px 12px rgba(19,146,120,.10)
      );
    }

    .hero-divider {
      align-self: center;
      height: 74px;
      border-left: 1.5px solid #5974c1;
    }

    .hero-copy {
      min-width: 0;
    }

    .hero h1 {
      font-size: clamp(22px,6.4vw,28px);
      margin: 0 0 6px;
      font-weight: 850;
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    .hero p {
      margin: 0;
      color: var(--secundario);
      font-size: 12px;
      line-height: 1.38;
    }

    /* SERVICIOS */

    .services {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .service {
      display: grid;
      grid-template-columns:
        minmax(0,1.32fr)
        minmax(0,1fr)
        82px;

      gap: 8px;
      align-items: center;
      min-height: 90px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.97);
      border-radius: 19px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--sombra);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .symbol {
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border-radius: 13px;
    }

    .symbol svg {
      width: 25px;
      height: 25px;
    }

    .electric {
      background: #fff0d1;
      color: #f5b21a;
    }

    .water {
      background: #deefff;
      color: #198fe7;
    }

    .gas {
      background: #ffeadb;
      color: #f97d26;
    }

    .internet {
      background: #ebe5ff;
      color: #4f4fdc;
    }

    .service-name {
      font-size: 15px;
      font-weight: 850;
      line-height: 1.18;
      letter-spacing: -.018em;
    }

    .service-description {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.22;
      color: var(--secundario);
    }

    /* NÚMEROS DE CUENTA */

    .account {
      min-width: 0;
      padding-left: 8px;
      border-left: 1px solid #ced8ee;
    }

    .account-label {
      display: block;
      margin-bottom: 2px;
      font-size: 9px;
      color: var(--secundario);
      white-space: nowrap;
    }

    .account-row {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    .account-number {
      font-size: 14px;
      font-weight: 820;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: all;
    }

    /* BOTÓN COPIAR */

    .copy {
      width: 28px;
      height: 30px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      margin-left: auto;
      background: #eaf1ff;
      border: 0;
      color: #2558c7;
      border-radius: 9px;
      cursor: pointer;
    }

    .copy svg {
      width: 17px;
      height: 17px;
    }

    /* BOTÓN PAGAR */

    .pay {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      min-height: 42px;
      padding: 0 7px;
      border-radius: 11px;
      background: linear-gradient(
        112deg,
        #3658e3,
        #3150cd
      );
      color: #fff;
      font-size: 12px;
      font-weight: 780;
      text-align: center;
      text-decoration: none;
      box-shadow:
        0 4px 12px rgba(48,77,212,.15);
      white-space: nowrap;
    }

    .pay:active {
      filter: brightness(.93);
    }

    .pay .wide {
      display: none;
    }

    .pay.disabled {
      background: #e8edf8;
      color: #6d7c9a;
      box-shadow: none;
      cursor: default;
    }

    /* AVISO DE SEGURIDAD */

    .tip {
      margin: 16px 6px 0;
      color: #596782;
      font-size: 10px;
      text-align: center;
      line-height: 1.45;
    }

    /* PIE DE PÁGINA */

    .footer {
      margin: 17px 8px 0;
      padding: 12px 0 3px;
      border-top:
        1px solid rgba(104,126,177,.19);
      color: #596782;
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }

    .footer strong {
      color: #24458d;
      font-weight: 750;
    }

    /* NOTIFICACIÓN */

    .toast {
      position: fixed;
      z-index: 10;
      bottom: calc(
        20px + env(safe-area-inset-bottom)
      );
      left: 50%;
      transform: translate(-50%,15px);
      background: #172f53;
      color: #fff;
      font-size: 12px;
      font-weight: 650;
      padding: 11px 15px;
      border-radius: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      box-shadow: 0 7px 20px #142a5040;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%,0);
    }

    :focus-visible {
      outline: 3px solid #1aa6dd;
      outline-offset: 3px;
    }

    /* IPHONE PEQUEÑO */

    @media (max-width:370px) {

      .app {
        padding-left: 9px;
        padding-right: 9px;
      }

      .header {
        padding: 8px;
      }

      .header-label {
        font-size: 11px;
      }

      .brand-name {
        font-size: 16px;
      }

      .hero-logo {
        width: 75px;
        height: 75px;
      }

      .hero {
        min-height: 111px;
      }

      .service {
        grid-template-columns:
          minmax(0,1.25fr)
          minmax(0,1fr)
          74px;
        padding: 9px;
        gap: 5px;
        min-height: 82px;
      }

      .symbol {
        flex-basis: 37px;
        width: 37px;
        height: 37px;
      }

      .service-name {
        font-size: 13px;
      }

      .service-description {
        font-size: 8px;
      }

      .account {
        padding-left: 5px;
      }

      .account-number {
        font-size: 13px;
      }

      .account-label {
        font-size: 8px;
      }

      .copy {
        width: 25px;
        flex-basis: 25px;
        height: 29px;
      }

      .pay {
        font-size: 11px;
        min-height: 39px;
      }
    }

    /* TABLET Y COMPUTADOR */

    @media (min-width:520px) {

      .app {
        padding: 18px 22px 34px;
      }

      .header {
        padding: 15px 24px;
        min-height: 78px;
        border-radius: 27px;
      }

      .brand-name {
        font-size: 26px;
      }

      .header-label {
        font-size: 20px;
      }

      .separator {
        height: 35px;
        margin: 0 12px;
      }

      .home {
        height: 50px;
        width: 50px;
      }

      .hero {
        gap: 24px;
        padding: 28px 22px;
        min-height: 185px;
      }

      .hero-logo {
        height: 130px;
        width: 130px;
      }

      .hero-divider {
        height: 100px;
      }

      .hero h1 {
        font-size: clamp(32px,4.3vw,50px);
      }

      .hero p {
        font-size: 17px;
      }

      .service {
        min-height: 114px;
        grid-template-columns:
          minmax(0,1.2fr)
          minmax(0,.85fr)
          172px;
        gap: 15px;
        padding: 18px 22px;
        border-radius: 23px;
      }

      .symbol {
        width: 64px;
        height: 64px;
        flex-basis: 64px;
        border-radius: 17px;
      }

      .symbol svg {
        width: 36px;
        height: 36px;
      }

      .service-name {
        font-size: 22px;
      }

      .service-description {
        font-size: 14px;
      }

      .account {
        padding-left: 16px;
      }

      .account-label {
        font-size: 14px;
        margin-bottom: 5px;
      }

      .account-number {
        font-size: 22px;
      }

      .copy {
        width: 37px;
        height: 37px;
        flex-basis: 37px;
      }

      .pay {
        min-height: 58px;
        font-size: 16px;
      }

      .pay .wide {
        display: inline;
      }

      .pay .short {
        display: none;
      }

      .tip {
        font-size: 13px;
        margin-top: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="app" id="inicio">

    <!-- ENCABEZADO SIN LOGO DUPLICADO -->

    <header class="header">

      <div class="brand">
        <span class="brand-name">ZONATA</span>
      </div>

      <span class="separator"
            aria-hidden="true"></span>

      <span class="header-label">
        Mis Servicios
      </span>

      <button
        class="home"
        id="home"
        type="button"
        title="Volver al inicio"
        aria-label="Volver al inicio">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.9"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">

          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <path d="M9 21v-8h6v8"/>

        </svg>

      </button>

    </header>

    <!-- LOGO PRINCIPAL -->

    <section class="hero" aria-labelledby="titulo">

      <img
        class="hero-logo"
        src="./icono.png"
        alt="ZONATA"
        width="90"
        height="90">

      <span class="hero-divider"
            aria-hidden="true"></span>

      <div class="hero-copy">

        <h1 id="titulo">
          Mis Servicios
        </h1>

        <p>
          Paga fácil tus servicios del hogar<br>
          en un solo lugar.
        </p>

      </div>

    </section>

    <!-- SERVICIOS -->

    <section
      class="services"
      id="servicios"
      aria-label="Cuentas y enlaces de pago">
    </section>

    <!-- AVISO -->

    <p class="tip">
      🔒 Los pagos se realizan en portales externos.
      Verifica la dirección web antes de ingresar
      datos bancarios.
    </p>

    <!-- CRÉDITO -->

    <footer class="footer">
      Aplicación diseñada por el ingeniero
      <strong>Víctor Díaz</strong>
    </footer>

  </main>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite">
  </div>

  <script>

    /*
    =====================================
    DATOS DE LOS SERVICIOS
    =====================================
    */

    const servicios = [

      {
        nombre: 'EDEQ',
        descripcion: 'Energía eléctrica',
        cuenta: '360954',
        tipo: 'electric',
        url: 'https://www.edeq.com.co/clientes-y-usuarios/factura-edeq/paga-tu-factura'
      },

      {
        nombre: 'EPA',
        descripcion: 'Agua y alcantarillado',
        cuenta: '167688',
        tipo: 'water',
        url: 'https://epa-epayco-prd.saas.arqbs.com/'
      },

      {
        nombre: 'EFIGAS',
        descripcion: 'Gas domiciliario',
        cuenta: '1493582',
        tipo: 'gas',
        url: 'https://portal.efigas.com.co/payments'
      },

      {
        nombre: 'Internet',
        descripcion: 'Servicio de internet',
        cuenta: '15359689',
        tipo: 'internet',
        url: ''
      }

    ];

    /*
    =====================================
    ICONOS
    =====================================
    */

    const iconos = {

      electric:
        '<path d="M13 2 5 13h6l-1 9 9-12h-6z" fill="currentColor"/>',

      water:
        '<path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13Z" fill="currentColor"/>' +
        '<path d="M9 17a4 4 0 0 1-1-4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>',

      gas:
        '<path d="M12 2c2 5-2 7 1 10 1-2 3-3 3-5 3 4 4 7 4 10a8 8 0 0 1-16 0c0-4 2-7 5-10-1 3 0 5 1 6 2-3 1-7 2-11Z" fill="currentColor"/>',

      internet:
        '<path d="M2 9c6-6 14-6 20 0M5 13c4-4 10-4 14 0M9 17c2-2 4-2 6 0" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>' +
        '<circle cx="12" cy="21" r="1.5" fill="currentColor"/>'

    };

    /*
    =====================================
    ICONO COPIAR
    =====================================
    */

    const copiarIcono = `
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.9"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">

        <rect x="8" y="8"
              width="12" height="12"
              rx="2"/>

        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>

      </svg>
    `;

    const iconoServicio = (tipo) =>
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      iconos[tipo] +
      '</svg>';

    const contenedor =
      document.getElementById('servicios');

    let timer;

    /*
    =====================================
    NOTIFICACIONES
    =====================================
    */

    function notificar(mensaje) {

      const toast =
        document.getElementById('toast');

      toast.textContent = mensaje;

      toast.classList.add('visible');

      clearTimeout(timer);

      timer = setTimeout(() => {
        toast.classList.remove('visible');
      }, 2200);

    }

    /*
    =====================================
    COPIAR CUENTAS
    =====================================
    */

    async function copiar(texto) {

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard.writeText(texto);

          notificar('✓ Cuenta copiada');
          return;

        }

      } catch (_) {}

      const t =
        document.createElement('textarea');

      t.value = texto;
      t.setAttribute('readonly', '');

      t.style.cssText =
        'position:fixed;top:0;left:0;opacity:0';

      document.body.append(t);

      t.focus();
      t.select();

      try {
        t.setSelectionRange(0, t.value.length);
      } catch (_) {}

      let ok = false;

      try {
        ok = document.execCommand('copy');
      } catch (_) {}

      t.remove();

      notificar(
        ok
          ? '✓ Cuenta copiada'
          : 'Mantén pulsado el número para copiar'
      );

    }

    /*
    =====================================
    CREACIÓN DE ELEMENTOS
    =====================================
    */

    function elemento(tag, clase, texto) {

      const e = document.createElement(tag);

      if (clase) {
        e.className = clase;
      }

      if (texto !== undefined) {
        e.textContent = texto;
      }

      return e;

    }

    /*
    =====================================
    CREAR LOS CUATRO SERVICIOS
    =====================================
    */

    servicios.forEach(s => {

      const fila = elemento(
        'article', 'service'
      );

      const identidad = elemento(
        'div', 'identity'
      );

      const simbolo = elemento(
        'span', 'symbol ' + s.tipo
      );

      simbolo.innerHTML = iconoServicio(s.tipo);

      simbolo.setAttribute(
        'aria-hidden', 'true'
      );

      const info = elemento(
        'div', 'service-info'
      );

      info.append(

        elemento(
          'div', 'service-name', s.nombre
        ),

        elemento(
          'div', 'service-description', s.descripcion
        )

      );

      identidad.append(simbolo, info);

      // Cuenta

      const cuenta = elemento(
        'div', 'account'
      );

      cuenta.append(
        elemento(
          'span', 'account-label', 'N.º de cuenta'
        )
      );

      const accion = elemento(
        'div', 'account-row'
      );

      accion.append(
        elemento(
          'span', 'account-number', s.cuenta
        )
      );

      // Copiar

      const botonCopiar = elemento(
        'button', 'copy'
      );

      botonCopiar.type = 'button';

      botonCopiar.innerHTML = copiarIcono;

      botonCopiar.title = 'Copiar cuenta';

      botonCopiar.setAttribute(
        'aria-label',
        'Copiar número de ' + s.nombre
      );

      botonCopiar.addEventListener(
        'click',
        () => copiar(s.cuenta)
      );

      accion.append(botonCopiar);
      cuenta.append(accion);

      // Enlace de pago

      const pago = elemento(
        'a', 'pay'
      );

      if (s.url) {

        pago.href = s.url;
        pago.rel = 'noreferrer';

        pago.title =
          'Pagar ' + s.nombre +
          ' en el portal correspondiente';

        pago.innerHTML = `
          <span class="short">Pagar ↗</span>
          <span class="wide">Pagar ahora ↗</span>
        `;

      } else {

        pago.classList.add('disabled');

        pago.textContent = 'Pendiente';

        pago.setAttribute(
          'aria-disabled', 'true'
        );

      }

      fila.append(identidad, cuenta, pago);

      contenedor.append(fila);

    });

    /*
    =====================================
    VOLVER AL INICIO
    =====================================
    */

    document.getElementById('home')
      .addEventListener('click', () => {

        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });

      });

  </script>

</body>
</html>
